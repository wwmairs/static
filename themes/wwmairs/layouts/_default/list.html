{{ define "main" }}
  <div class="grid">
    <div class="grid2">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </div>
  </div>
  {{ range .Pages.GroupByDate "2006" }}
  <section class="entry-year-group grid">
    <h2 class="list-date-label grid1"> {{ .Key }} </h2>
    {{ range .Pages }}
      <div class="list-entry grid2">
        <!-- {{ .Summary }} -->
        {{ partial "hover-image-link.html" . }}
      </div>
    {{ end }}
    
  </section>
  {{ end}}
  
{{ end }}
