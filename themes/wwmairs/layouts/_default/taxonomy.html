{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range (where .Pages "Type" "in" (slice "work")).GroupByDate "2006" }}
  <section>
    <h2 class="list-date-label"> {{ .Key }} </h2>
    {{ range .Pages }}
      <div class="list-entry">
        <!-- {{ .Summary }} -->
        {{ partial "hover-image-link.html" . }}
      </div>
    {{ end }}
    
  </section>
  {{ end}}
{{ end }}
